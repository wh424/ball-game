<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>공 vs 공 시뮬레이터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#0f172a;color:#f8fafc;
  height:100dvh;display:flex;
  flex-direction:column;overflow:hidden;
  font-family:sans-serif;
}
.hd{
  padding:10px 14px;display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1e293b;
  border-bottom:1px solid #334155;
}
.hd h1{font-size:17px;font-weight:800;}
.bg{
  font-size:11px;padding:4px 9px;
  border-radius:99px;background:#0f172a;
  color:#38bdf8;border:1px solid #334155;
}
.sc{
  display:none;flex:1;
  flex-direction:column;overflow:hidden;
}
.sc.on{display:flex;}
.tabs,.sh{display:flex;gap:6px;padding:6px 14px;}
.tb,.sb{
  flex:1;padding:7px;border-radius:8px;
  border:1px solid #334155;
  background:#1e293b;color:#94a3b8;
  font-weight:700;font-size:12px;
}
.tb.on{background:#2563eb;color:#fff;}
.sb.on{border-color:#f59e0b;color:#fbbf24;}
.sl{
  display:flex;align-items:center;
  gap:8px;padding:4px 14px;
}
.tc{flex:1;display:flex;flex-direction:column;gap:4px;}
.bx{
  background:#1e293b;
  border:2px dashed #475569;
  border-radius:10px;padding:6px;
  text-align:center;min-height:40px;
}
.bx.sel{border-color:#facc15;background:#27272a;}
.bx.fa{border-style:solid;border-color:#ef4444;}
.bx.fb{border-style:solid;border-color:#3b82f6;}
.rl{
  flex:1;overflow-y:auto;
  padding:4px 14px 12px;display:flex;
  flex-direction:column;gap:8px;
}
.cd{
  display:flex;align-items:center;
  gap:12px;background:#1e293b;
  border:1px solid #334155;
  border-radius:12px;padding:10px;
}
.ic{
  width:36px;height:36px;border-radius:50%;
  flex-shrink:0;display:flex;
  align-items:center;justify-content:center;
  font-weight:900;color:#fff;
}
.bt{
  padding:10px 14px;background:#1e293b;
  border-top:1px solid #334155;
  display:flex;gap:8px;
}
.bp{
  flex:2;padding:12px;border-radius:10px;
  border:none;background:#10b981;
  color:#fff;font-size:15px;font-weight:800;
}
.bp:disabled{background:#334155;color:#64748b;}
.bs{
  flex:1;padding:10px;border-radius:10px;
  border:1px solid #475569;
  background:#0f172a;color:#e2e8f0;
  font-size:12px;font-weight:700;
}
.hud{display:flex;gap:8px;padding:8px 10px;background:#1e293b;}
.hc{
  background:#0f172a;border-radius:8px;
  padding:6px 8px;border-left:3px solid #ef4444;
}
.hc.b{border-left-color:#3b82f6;}
.bar{
  height:5px;background:#334155;
  border-radius:3px;overflow:hidden;margin:3px 0;
}
.db{
  min-height:14px;font-size:11px;
  font-weight:800;color:#ef4444;
  display:flex;gap:5px;
}
.aw{
  flex:1;display:flex;
  align-items:center;justify-content:center;
  padding:6px;
}
canvas{
  background:#090d16;border-radius:12px;
  max-width:100%;max-height:100%;
}
.md{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.md.on{display:flex;}
.mb{
  background:#1e293b;border:1px solid #475569;
  border-radius:14px;padding:18px;
  width:100%;max-width:360px;
}
</style>
</head>
<body>
<div id="s1" class="sc on">
  <div class="hd">
    <h1>공 vs 공 시뮬레이터</h1>
    <span class="bg" id="cnt">로딩</span>
  </div>
  <div class="tabs">
    <button class="tb on" id="m1">1 vs 1 개인전</button>
    <button class="tb" id="m2">2 vs 2 팀전</button>
  </div>
  <div class="sl" id="sl"></div>
  <div class="sh">
    <button class="sb on" data-s="4">정사각형</button>
    <button class="sb" data-s="8">정8각형</button>
    <button class="sb" data-s="12">정12각형</button>
  </div>
  <div class="rl" id="rl"></div>
  <div class="bt">
    <button class="bs" id="od1">디버프 도감</button>
    <button class="bp" id="go" disabled>전투 시작</button>
  </div>
</div>

<div id="s2" class="sc">
  <div class="hd">
    <h1>자동 전투</h1>
    <button class="bg" id="sp">1x 배속</button>
  </div>
  <div class="hud" id="hud"></div>
  <div class="aw">
    <canvas id="cv" width="360" height="360"></canvas>
  </div>
  <div class="bt">
    <button class="bs" id="od2">디버프 도감</button>
    <button class="bs" id="ed" style="color:#f87171">전투 끝내기</button>
  </div>
</div>

<div id="dm" class="md">
  <div class="mb">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-weight:800">
      <span>디버프 도감</span>
      <button class="bg" id="cdm">닫기</button>
    </div>
    <div id="dl"></div>
  </div>
</div>

<div id="rm" class="md">
  <div class="mb" style="text-align:center">
    <h2 id="wt" style="color:#fbbf24;margin-bottom:14px">승리!</h2>
    <div style="display:flex;gap:8px">
      <button class="bs" id="bk">팀 다시 고르기</button>
      <button class="bp" id="re">재대결</button>
    </div>
  </div>
</div>

<script src="./balls.js"></script>
<script src="./engine.js"></script>
</body>
</html>
