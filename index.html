<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>공 vs 공 자동 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
    
    /* 공통 헤더 */
    .header { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; background: #1e293b; border-bottom: 1px solid #334155; }
    .header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; }

    /* 화면 전환 */
    .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .screen.active { display: flex; }

    /* 편성 화면 */
    .mode-tabs { display: flex; gap: 6px; padding: 8px 14px 4px; }
    .mode-btn { flex: 1; padding: 7px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-weight: 700; font-size: 13px; cursor: pointer; }
    .mode-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }

    .slots-area { display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
    .team-col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .slot-box { background: #1e293b; border: 2px dashed #475569; border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
    .slot-box.selected { border-color: #facc15; background: #27272a; }
    .slot-box.team-a.filled { border-style: solid; border-color: #ef4444; }
    .slot-box.team-b.filled { border-style: solid; border-color: #3b82f6; }
    .slot-label { font-size: 10px; color: #94a3b8; font-weight: 700; }
    .slot-name { font-size: 13px; font-weight: 700; margin-top: 2px; }
    .vs-text { font-weight: 900; color: #f59e0b; font-size: 14px; }

    .shape-bar { display: flex; gap: 6px; padding: 4px 14px 8px; }
    .shape-btn { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer; }
    .shape-btn.active { border-color: #f59e0b; color: #fbbf24; background: #292524; }

    /* 공 선택 1열 스크롤 리스트 */
    .roster-list { flex: 1; overflow-y: auto; padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
    .ball-card { display: flex; align-items: center; gap: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    .ball-card:active { transform: scale(0.98); background: #334155; }
    .ball-icon { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    .ball-info { flex: 1; min-width: 0; }
    .ball-title { font-size: 14px; font-weight: 800; color: #f8fafc; margin-bottom: 3px; }
    .ball-desc { font-size: 11.5px; color: #cbd5e1; line-height: 1.35; word-break: keep-all; }

    .bottom-bar { padding: 10px 14px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; }
    .btn-primary { flex: 2; padding: 12px; border-radius: 10px; border: none; background: #10b981; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .btn-sub { flex: 1; padding: 12px 8px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* 전투 화면 */
    .hud-area { display: flex; gap: 8px; padding: 8px 10px; background: #1e293b; }
    .hud-team { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .hud-card { background: #0f172a; border-radius: 8px; padding: 6px 8px; border-left: 3px solid #ef4444; }
    .hud-card.team-b { border-left-color: #3b82f6; }
    .hud-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 3px; }
    .bar-bg { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-bottom: 3px; }
    .hp-fill { height: 100%; background: #ef4444; transition: width 0.1s; }
    .cd-fill { height: 100%; background: #38bdf8; }
    .debuff-line { min-height: 15px; font-size: 11px; font-weight: 800; color: #ef4444; display: flex; flex-wrap: wrap; gap: 5px; }

    .arena-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px; position: relative; }
    canvas { background: #090d16; border-radius: 12px; max-width: 100%; max-height: 100%; }

    .battle-controls { padding: 8px 14px; display: flex; gap: 8px; background: #1e293b; border-top: 1px solid #334155; }
    .ctrl-btn { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* 모달 (도감 & 결과) */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal.active { display: flex; }
    .modal-box { background: #1e293b; border: 1px solid #475569; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; max-height: 80dvh; overflow-y: auto; }
    .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .dict-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .dict-name { color: #ef4444; font-weight: 800; font-size: 13px; margin-bottom: 4px; }
    .dict-desc { color: #cbd5e1; font-size: 12px; line-height: 1.4; }
    .error-banner { display: none; background: #dc2626; color: #fff; padding: 8px; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div id="errorBanner" class="error-banner"></div>

  <!-- 1. 편성 화면 -->
  <div id="setupScreen" class="screen active">
    <div class="header">
      <h1>공 vs 공 시뮬레이터</h1>
      <span class="badge" id="ballCountBadge">로딩 중...</span>
    </div>

    <div class="mode-tabs">
      <button class="mode-btn active" id="btnMode1v1">1 vs 1 개인전</button>
      <button class="mode-btn" id="btnMode2v2">2 vs 2 팀전</button>
    </div>

    <div class="slots-area" id="slotsArea"></div>

    <div class="shape-bar">
      <button class="shape-btn active" data-shape="4">정사각형</button>
      <button class="shape-btn" data-shape="8">정8각형</button>
      <button class="shape-btn" data-shape="12">정12각형</button>
    </div>

    <div class="roster-list" id="rosterList"></div>

    <div class="bottom-bar">
      <button class="btn-sub" id="btnOpenDictSetup">디버프 도감</button>
      <button class="btn-primary" id="btnStartBattle" disabled>전투 시작</button>
    </div>
  </div>

  <!-- 2. 전투 화면 -->
  <div id="battleScreen" class="screen">
    <div class="header">
      <h1>자동 전투 진행 중</h1>
      <button class="badge" id="btnSpeed" style="cursor:pointer; font-weight:800;">1x 배속</button>
    </div>

    <div class="hud-area" id="hudArea"></div>

    <div class="arena-wrap">
      <canvas id="gameCanvas" width="360" height="360"></canvas>
    </div>

    <div class="battle-controls">
      <button class="ctrl-btn" id="btnOpenDictBattle">디버프 도감</button>
      <button class="ctrl-btn" id="btnEndBattle" style="color:#f87171;">전투 끝내기</button>
    </div>
  </div>

  <!-- 디버프 도감 모달 -->
  <div id="dictModal" class="modal">
    <div class="modal-box">
      <div class="modal-title">
        <span>디버프 키워드 도감</span>
        <button class="badge" id="btnCloseDict" style="cursor:pointer;">닫기</button>
      </div>
      <div id="dictList"></div>
    </div>
  </div>

  <!-- 결과 모달 -->
  <div id="resultModal" class="modal">
    <div class="modal-box" style="text-align:center;">
      <h2 id="winnerText" style="font-size:22px; margin-bottom:8px; color:#fbbf24;">승리!</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:16px;">전투가 종료되었습니다.</p>
      <div style="display:flex; gap:8px;">
        <button class="btn-sub" id="btnBackSetup">팀 다시 고르기</button>
        <button class="btn-primary" id="btnRematch">재대결</button>
      </div>
    </div>
  </div>

  <!-- 데이터(balls.js) 먼저 로드 후 엔진(engine.js) 실행 -->
  <script src="./balls.js"></script>
  <script src="./engine.js"></script>
</body>
</html>
